name: 發布專欄

on:
  push:
    branches:
      - main
    paths:
      - "posts/**"
      - "data/about.md"
      - "templates/**"
      - "assets/style.css"
      - "assets/favicon.svg"
      - "assets/og.png"
      - "scripts/build_site.py"
      - "config/settings.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-posts
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 取出程式
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 測試
        run: python3 -m unittest scripts/test_site.py

      - name: 產生頁面
        env:
          PYTHONIOENCODING: utf-8
          TZ: Asia/Taipei
        run: python3 scripts/build_site.py

      - name: 提交頁面
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html sitemap.xml about archive column
          git status --short
          if git diff --staged --quiet; then
            echo "沒有需要更新的頁面"
            exit 0
          fi
          git commit -m "build: 更新專欄頁面 [skip ci]"
          git push
